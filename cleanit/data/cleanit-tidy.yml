templates:
  - &tidy
    tags:
      - tidy
      - default
      - minimal
    priority: -10000

rules:
  replace-multiple-spaces-with-single-space[tidy]:
    <<: *tidy
    patterns: '\s{2,}'
    replacement: ' '
    examples:
      ? |
        Foo     bar.
      : |
        Foo bar.
  drop-extra-spaces-before-punctuation[tidy]:
    <<: *tidy
    patterns: '(?P<x>\S)\s+(?P<y>\.{1,3})$'
    replacement: '\g<x>\g<y>'
    examples:
      ? |
        "FooBar"  ...
      : |
        "FooBar"...
  add-space-after-comma[tidy]:
    <<: *tidy
    patterns: '(?P<x>[[:upper:][:lower:]]),(?P<y>[[:upper:][:lower:]])'
    replacement: '\g<x>, \g<y>'
    examples:
      ? |
        Ora,essa é uma surpresa e tanto.
      : |
        Ora, essa é uma surpresa e tanto.
      ? |
        - Happy hour,hein?
      : |
        - Happy hour, hein?
  add-extra-space-after-dash[tidy]:
    <<: *tidy
    patterns: '(?:^(?P<x>|(?:\<\w\>)))-(?P<y>(?:\.{2,3})?[''\"]?[\w|(]+)'
    replacement: '\g<x>- \g<y>'
    flags: multiline
    examples:
      ? |
        <i>-Francine, o que houve?
        -O que aconteceu? Diga-me!</i>
      : |
        <i>- Francine, o que houve?
        - O que aconteceu? Diga-me!</i>
  drop-only-punctuation-lines[tidy]:
    <<: *tidy
    patterns: '^\s*\.+\s*$'
    examples:
      - '...'
  drop-only-spaces-lines[tidy]:
    <<: *tidy
    patterns: '^\s*$'
    examples:
      - '     '
  drop-starting-dash-for-single-lines[tidy]:
    <<: *tidy
    patterns: '^\-\s*(?P<x>[^\n\r]*|(?:[^\n\r]*[\n\r][^-][^\n\r]*)+)$'
    flags: dotall
    replacement: '\g<x>'
    examples:
      ? |
        - At 28 minutes past midnight,
      : |
        At 28 minutes past midnight,
      ? |
        - Francine, o que houve?
        - O que aconteceu? Diga-me!
      : |
        - Francine, o que houve?
        - O que aconteceu? Diga-me!
      ? |
        - Oh, if you were my girl,
        I wouldn't leave you alone.
      : |
        Oh, if you were my girl,
        I wouldn't leave you alone.
      ? |
        - Oh, if you were my girl,
        I wouldn't leave you alone.
        And you shouldn't leave me alone.
      : |
        Oh, if you were my girl,
        I wouldn't leave you alone.
        And you shouldn't leave me alone.
      ? |
        - Oh, if you were my girl,
        - I wouldn't leave you alone.
      : |
        - Oh, if you were my girl,
        - I wouldn't leave you alone.
      ? |
        - Oh, if you were my girl,
        - I wouldn't leave you alone.
        And you shouldn't leave me alone.
      : |
        - Oh, if you were my girl,
        - I wouldn't leave you alone.
        And you shouldn't leave me alone.
  drop-orphan-dash-lines[tidy]:
    <<: *tidy
    patterns:
      - '\n[ \t]*-[ \t]*(?=\n|$)'
      - '^[ \t]*-[ \t]*\n'
    replacement: ''
    examples:
      ? |
        - At first, I thought...
        -
      : |
        - At first, I thought...
      ? |
        -
        - Howdy, cowboys and cowgirls!
      : |
        - Howdy, cowboys and cowgirls!
      ? |
        - Are you sure?
        - Yes.
      : |
        - Are you sure?
        - Yes.
      ? |
        - Wait...
        - ...for what?
      : |
        - Wait...
        - ...for what?
  replace----with-...[tidy]:
    <<: *tidy
    patterns: '(?P<x>\w)\-{2}$'
    flags: multiline
    replacement: '\g<x>...'
    examples:
      ? |
        - No. Rachel, I know you're his friend, but--
        - Harvey, trust me.
      : |
        - No. Rachel, I know you're his friend, but...
        - Harvey, trust me.
  replace-..-with-...[tidy]:
    <<: *tidy
    patterns: '(?<!\.)\.{2}(?!\.)'
    replacement: '...'
    examples:
      ? |
        ...is the first
        in decades.
      : |
        ...is the first
        in decades.
      ? |
        ..is the first
        in decades.
      : |
        ...is the first
        in decades.
